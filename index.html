<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .number-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #007BFF;
            letter-spacing: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>IP and Port:</h1>
        
        <!-- Large single number display -->
        <div class="number-display">192.168.1.105:223</div>
    </div>

</body>
</html>
